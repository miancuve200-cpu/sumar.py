<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sumas - Estudiantes</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 3rem auto; padding: 0 1rem; }
        .caja { background: #f5f5f5; padding: 2rem; border-radius: 10px; }
        input { width: 100%; padding: 0.7rem; margin: 0.5rem 0; font-size: 1rem; }
        button { background: #2563eb; color: white; border: none; padding: 0.8rem; width: 100%; font-size: 1rem; border-radius: 5px; cursor: pointer; }
        #resultado { margin-top: 1.5rem; font-size: 1.2rem; font-weight: bold; color: #166534; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>Calcula tu suma</h2>
        <input type="number" id="num1" placeholder="Primer número" required>
        <input type="number" id="num2" placeholder="Segundo número" required>
        <button onclick="sumar()">VER RESULTADO</button>
        <div id="resultado"></div>
    </div>

    <script>
        function sumar() {
            const n1 = parseFloat(document.getElementById('num1').value) || 0;
            const n2 = parseFloat(document.getElementById('num2').value) || 0;
            const total = n1 + n2;
            document.getElementById('resultado').innerHTML = 
                `✅ ${n1} + ${n2} = ${total}`;
        }
    </script>
</body>
</html>
